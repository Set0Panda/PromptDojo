<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly martial-arts dojo — encouraging sensei, short punchy rounds
   IDEA: earning belts; each belt is one Claude skill, the black belt is a real test
   PICTURE: the dojo wall — sensei character + belt rack that fills in as you progress
   COLOUR and TYPE: paper white, ink, vermilion accent, indigo support; Archivo 900 + Atkinson Hyperlegible
   LAYOUT: wall band on top, one training mat (card) below, feedback from the sensei bubble */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ef,#121726);--wall:light-dark(#e9e3d6,#1b2238);--ink:light-dark(#1b1a1f,#f1eee7);
--mute:light-dark(#5d5a63,#a9a8b6);--mat:light-dark(#ffffff,#1e2640);--line:light-dark(#d9d2c3,#2f3858);
--red:#e5432b;--indigo:light-dark(#273f7a,#8fa8ff);--ok:light-dark(#1f7a4a,#6fd6a0);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
h1{font-weight:900;font-size:clamp(32px,5vw,50px);letter-spacing:-.01em}
h2{font-weight:800;font-size:clamp(24px,3vw,32px)}
.band{padding:clamp(24px,4vw,52px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
.wall{background:var(--wall);border-bottom:6px solid var(--ink)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:end}
.lede{color:var(--mute);max-width:56ch;margin:12px 0 22px}
.rack{display:flex;gap:8px;flex-wrap:wrap}
.belt{flex:1 1 80px;min-width:76px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.belt i{display:block;height:20px;border-radius:4px;border:2px solid var(--ink);position:relative;opacity:.28}
.belt i::after{content:"";position:absolute;right:14px;top:-4px;width:10px;height:24px;background:inherit;border:2px solid var(--ink);border-radius:3px}
.belt.won i,.belt.open i{opacity:1}.belt.open:not(.won) i{opacity:.6}
.belt span{display:block;font-size:13px;margin-top:6px;color:var(--mute)}
.belt.cur span{color:var(--ink);font-weight:700}
.belt:focus-visible{outline:3px solid var(--red);outline-offset:4px;border-radius:4px}
.belt:disabled{cursor:not-allowed}
.sensei{position:relative}
.sensei svg{width:100%;height:auto;display:block}
.bubble{background:var(--mat);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:10px;position:relative;min-height:64px}
.bubble::after{content:"";position:absolute;bottom:-10px;left:60%;width:16px;height:16px;background:var(--mat);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.matcard{background:var(--mat);border:2px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,32px)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-bottom:10px}
.pips{display:flex;gap:6px}.pips b{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pips b.d{background:var(--indigo)}.pips b.c{background:var(--red)}
.task{background:var(--bg);border-left:5px solid var(--indigo);border-radius:8px;padding:12px 16px;margin:16px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;font:inherit;color:inherit;background:var(--mat);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:44px;white-space:pre-wrap}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--mat))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--mat))}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg)}
.why strong{font-family:Archivo,sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{display:inline-flex;align-items:center;text-decoration:none;font:700 16px Archivo,sans-serif;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 20px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font:inherit;font-size:15px;border:2px solid var(--line);background:var(--mat);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--indigo);background:color-mix(in srgb,var(--indigo) 14%,var(--mat))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:10px}
.pane{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px;white-space:pre-wrap}
.pane h3{font-size:14px;font-weight:800;margin-bottom:8px;color:var(--mute)}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;width:0;background:var(--red);transition:width .4s}
textarea{width:100%;min-height:170px;font:16px/1.5 inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px;resize:vertical}
ul.fb{margin:6px 0 0;padding-left:20px}
.small{font-size:14px;color:var(--mute)}
.score{font:900 clamp(40px,7vw,64px) Archivo,sans-serif;color:var(--red);line-height:1}
.hide{display:none!important}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.belt.won.just i{animation:pop .5s}
@media(prefers-reduced-motion:reduce){.belt.won.just i{animation:none}.meter i{transition:none}}
@media(max-width:700px){.top{grid-template-columns:minmax(0,1fr)}.sensei{max-width:260px}.two{grid-template-columns:minmax(0,1fr)}}
</style>
<style>
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{font:16px inherit;font-family:inherit;color:var(--ink);background:var(--mat);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;min-height:44px}
.sub{font:800 18px Archivo,sans-serif;margin:6px 0 0;color:var(--red)}
.stage{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.themes{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px}
.themes h3{font-size:15px;color:var(--mute);margin:4px 0 2px}
.th{text-align:left;font:inherit;color:var(--ink);background:var(--mat);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.th b{display:block;font-family:Archivo,sans-serif}.th small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
.th em{font-style:normal;font-size:13px;color:var(--mute);float:right}
.th[aria-pressed=true]{border-color:var(--red);box-shadow:inset 5px 0 0 var(--red)}
.th:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}.themes{display:grid;grid-template-columns:1fr 1fr;position:static}.themes h3{display:none}.themes .th:last-child:nth-child(even){grid-column:1/-1}}
.intro{margin:0 0 6px;color:var(--mute);font-size:15px}
.th b svg{width:20px;height:20px;vertical-align:-4px;margin-right:8px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--red)}
.saym{display:none}
@media(max-width:600px){.wall{padding:14px 16px 12px;border-bottom-width:4px}.top{gap:0}h1{font-size:28px}.sub{font-size:15px;margin-top:2px}.lede,.sensei{display:none}.rack{gap:4px;margin-top:10px}.belt{flex:1 1 0;min-width:0}.belt span{display:none}.belt i{height:14px}.belt i::after{display:none}main.band{padding:12px 12px 24px}.matcard{padding:14px;border-radius:14px}h2{font-size:20px}.task{padding:8px 12px;margin:10px 0}.opts{gap:8px;margin-top:10px}.opt{padding:12px 14px}.th{padding:8px 10px;display:flex;align-items:center;gap:6px;min-width:0}.th b{flex:1;min-width:0;font-size:14px;line-height:1.15}.th b svg{width:18px;height:18px;margin-right:6px}.th em{float:none;order:2;white-space:nowrap;font-size:12px}.th{min-height:40px}.themes{gap:6px}.th .ip{display:none}.th small{display:none}.saym{display:block;margin:0 0 8px;font-size:14px;color:var(--mute);min-height:1.4em}.meta{margin-bottom:4px}}
.foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.foot .btn{padding:6px 14px;min-height:40px;font-size:14px}
</style>
</head>
<body>
<header class="band wall">
  <div class="wrap top">
    <div>
      <div class="topline"><h1>Prompt Dojo</h1><select class="lang hide" id="lang" aria-label="Language"></select></div>
      <p class="sub" id="sub"></p>
      <p class="lede" id="lede"></p>
      <div class="rack" id="rack"></div>
    </div>
    <div class="sensei">
      <div class="bubble" id="say" aria-live="polite"></div>
      <svg viewBox="0 0 220 170" aria-hidden="true">
        <ellipse cx="110" cy="162" rx="70" ry="7" fill="currentColor" opacity=".12"/>
        <path d="M45 160 Q40 95 110 92 Q180 95 175 160 Z" fill="#273f7a"/>
        <path d="M80 98 L110 140 L140 98" fill="none" stroke="#f6f4ef" stroke-width="7"/>
        <rect x="55" y="128" width="110" height="12" rx="3" fill="#1b1a1f"/>
        <rect x="128" y="126" width="12" height="30" rx="3" fill="#1b1a1f" transform="rotate(12 134 140)"/>
        <circle cx="110" cy="58" r="44" fill="#f2c9a0"/>
        <path d="M68 50 Q110 4 152 50 Q130 30 110 32 Q90 30 68 50Z" fill="#e9e3d6"/>
        <path d="M72 62 Q60 82 74 104 Q82 84 80 66Z M148 62 Q160 82 146 104 Q138 84 140 66Z" fill="#e9e3d6"/>
        <path d="M92 58 q6 -6 12 0 M116 58 q6 -6 12 0" stroke="#1b1a1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M86 78 Q110 112 134 78 Q110 90 86 78Z" fill="#f6f4ef"/>
        <circle cx="88" cy="70" r="5" fill="#e5432b" opacity=".35"/><circle cx="132" cy="70" r="5" fill="#e5432b" opacity=".35"/>
      </svg>
    </div>
  </div>
</header>

<main class="band">
  <div class="wrap"><p class="saym" id="saym" aria-hidden="true"></p><div class="stage"><nav class="themes" id="themes" aria-label="Themes"></nav><div class="matcard" id="mat"></div></div>
  <div class="foot small"><span id="note"></span><button class="btn ghost" id="reset"></button></div></div>
</main>

<script>
{
/* ===== All text lives here. To add a language, copy the "en" block, translate the values, and add it to LANGS. ===== */
const LANGS={en:{
 langName:"English",aiLang:"English",
 ui:{sub:"AI is not Google",beltOf:n=>`${n} belt`,themesLabel:"Pick a theme",saved:n=>`Your ${n} progress is saved. Come back any time.`,resumed:n=>`Welcome back to ${n}. Carrying on where you left off.`,inProgress:"in progress",lede:"You've heard of AI. Seven short belts show you how to actually use it: talk to it, don't search it.",go:"Let's go.",
  hello:"Welcome, student. Pick the first belt and let's begin.",note:"Progress is saved in this browser. The black-belt test sends your message to Claude, so it asks permission the first time.",
  reset:"Start over",resetDone:"Progress cleared. Ready for the next student.",belt:"belt",earned:"earned",locked:"locked",
  pickQ:"Which message gets the more useful answer?",situation:"Situation",right:"Exactly. Notice why it works.",wrong:"Not quite. Look at the green one.",
  next:"Next",finish:"Finish belt",gotIt:"Right.",catch:"Here's the catch.",better:"The better one",
  buildQ:"Build the message",task:"Task",buildHint:"Tap pieces to add them. Watch Claude's likely answer change.",quality:"How useful the answer will be",
  yourMsg:"Your message",likely:"Claude's likely answer",check:"Check my message",clean:"Great message.",almost:"Almost.",
  cleanWhy:"Who it's for, what you've got, the limits, what you want back. That's the difference between searching and asking.",
  fluff:"Drop the extras: hype words add pressure, not information, and details that don't change the plan just add noise. Ask yourself: would this change what Claude suggests?",missing:"Still missing:",
  buildOk:"Every piece earns its place. Well done.",buildNo:"Each piece should tell Claude something it couldn't guess.",
  won:n=>`${n} belt earned`,notYet:"Not this time",unlocked:s=>`Habit unlocked: ${s}.`,need:(n,t)=>`You need ${n} of ${t}. The explanations are the real lesson. Have another go.`,
  goNext:n=>`Next: ${n} belt`,retry:"Retry",bow:"Bow to your new belt.",fail:"Every master failed more times than the student has tried.",
  freeQ:"Write it yourself",freeLabel:"Your message to Claude (make up any details you need)",freePh:"Write it like you'd explain it to a helpful friend…",
  grade:"Score my message",grading:"Scoring…",study:"Let me study this…",empty:"Write something first, student.",again:"Score again",
  blackOk:"A black belt. The dojo has nothing more to teach you, only practice.",blackNo:"Good start. Read the tips and try again.",
  byClaude:"Scored by Claude",offline:"Quick offline check (Claude scoring isn't available here)",pass:"75 to pass",works:"What works",improve:"To improve",stronger:"A stronger version",
  run:"Send it to Claude for real",askClaude:"Get feedback in Claude",tryClaude:"Try it in Claude",copied:"Copied. If Claude opens with an empty box, just paste.",copyFail:"Couldn't copy automatically. Select the text below and copy it.",takeIt:"Take it to your own Claude (free account works):",
  coachMsg:(sc,p)=>`I'm practising writing better messages to AI assistants.\n\nThe situation: ${sc}\n\nMy message:\n"""\n${p}\n"""\n\nPlease (1) score my message out of 100 for how likely it is to get a genuinely useful, personal answer, (2) tell me what works, (3) give me up to 3 concrete fixes, and (4) show me an improved version. Keep it friendly and plain. Then (5) answer my original message as if I'd sent it.`,thinking:"Thinking…",limited:"Too many requests right now. Wait a minute and try again.",noReach:"Couldn't reach Claude from here.",other:"Different situation",
  h:{long:"Enough detail to work with.",short:"Add more detail. Claude is guessing a lot.",num:"Includes specifics like numbers or dates.",noNum:"Add specifics: dates, amounts, ages, budget.",
   me:"Tells Claude about your situation.",noMe:"Say who it's for and what your situation is.",fmt:"Says what you want back.",noFmt:"Say what you want back: a list, a short message, steps…",
   hype:"Cut words like \"perfect\" or \"amazing\". They add pressure, not information."},
  rx:{me:/\b(i|i'm|my|we|our|me)\b/i,fmt:/(list|steps|short|words|plan|ideas|table|message|email|explain|options)/i,hype:/(perfect|amazing|best ever|!!!)/i}},
 belts:[
 {name:"White",skill:"Talk, don't search",type:"pick",intro:"Google wants keywords. Claude wants your situation: facts, not adjectives.",
  qs:[
  {task:"You want something for dinner tonight.",opts:[
   {t:"Quick, healthy, tasty chicken dinners the whole family will love?",why:"All adjectives. Claude still doesn't know what's in your fridge or who's eating."},
   {t:"Chicken, rice, lemon, spinach. 30 min. Kids hate spicy. 3 ideas?",ok:1,why:"Short, but every word is a useful fact."},
   {t:"What can I cook with chicken tonight? I'm shattered after work.",why:"Friendly, but the facts that shape the answer are missing."}]},
  {task:"You got an official letter full of jargon.",opts:[
   {t:"Tax office letter, ref AB-2231-X, mentions a «requerimiento». What now?",why:"Claude can't look up your reference, and hasn't seen the letter."},
   {t:"[photo of the letter] What does it want, and is there a deadline?",ok:1,why:"Show the real thing and ask exactly what you need."},
   {t:"What do tax office letters usually mean?",why:"A general question gets a general answer."}]},
  {task:"You want to buy a new phone.",opts:[
   {t:"Best camera, best battery, biggest screen, fastest. But cheap. Which one?",why:"Contradictory. Say what matters most, or Claude chooses for you."},
   {t:"My Samsung is 4 years old and slow. Which phone should I get?",why:"No budget, no idea how you use it. Expect a generic list."},
   {t:"Max €350. WhatsApp and photos, all-day battery, not big. 3 options?",ok:1,why:"Budget, use, priorities and dislikes. A real recommendation."}]},
  {ask:"What's the most useful thing to add?",msg:"Write a message to my boss asking for Friday off.",task:"You're about to send this.",opts:[
   {t:"\"Make it professional.\"",why:"Claude would anyway. It gives your boss no reason to say yes."},
   {t:"\"It's my sister's wedding. Marta will cover my shift.\"",ok:1,why:"The reason, and the answer to your boss's main worry."},
   {t:"\"My boss is Laura. She's been my manager for two years.\"",why:"Nice for the greeting, but it won't get you a yes."}]}]},
 {name:"Yellow",skill:"Give it the details",type:"build",intro:"Build a message. Only pick the pieces that change the answer."},
 {name:"Orange",skill:"Keep the conversation going",type:"pick",intro:"Claude remembers the chat. Correct it and build on it. Don't start again.",
  qs:[
  {task:"Claude's explanation of mortgages was too complicated.",opts:[
   {t:"Simpler, please. Use an example with real numbers.",ok:1,why:"Say what was wrong and what you want. It adjusts at once."},
   {t:"Can you give me a link to a simpler website?",why:"Back to searching. Claude can simplify it right here."},
   {t:"Open a new chat and ask «explain mortgages» again, hoping it's simpler.",why:"Same question, same level. Saying «simpler» is what changes it."}]},
  {task:"You like Claude's second recipe, but your guest is vegetarian.",opts:[
   {t:"New chat, so the chicken recipes don't confuse it.",why:"A myth. The earlier messages are what it builds on."},
   {t:"Vegetarian rice and spinach recipe for 4, 30 minutes?",why:"Works, but you've lost the recipe you liked."},
   {t:"Make the second one vegetarian. What do I buy?",ok:1,why:"It remembers. Point to it and say what to change."}]},
  {task:"Claude's note to your noisy neighbour sounds a bit aggressive.",opts:[
   {t:"That's wrong.",why:"Claude knows you're unhappy, not why."},
   {t:"Softer. I live next door. Keep the part about the times.",ok:1,why:"What to change, why, and what to keep."},
   {t:"Rewrite it.",why:"You'll get a different note, not necessarily a kinder one."}]},
  {task:"You want to plan a weekend away but don't know what details matter.",opts:[
   {t:"Plan a weekend away. Ask me questions first, one at a time.",ok:1,why:"Let Claude interview you. It knows what matters."},
   {t:"Romantic weekend in Seville, food and walks. Make it special.",why:"A start, but no budget, dates or travel. Claude will guess."},
   {t:"What should I tell an AI to plan a trip?",why:"You'll get a checklist to fill in yourself."}]}]},
 {name:"Green",skill:"Let it do the job",type:"pick",intro:"Don't ask how to do it. Ask Claude to do it, or to practise it with you.",
  qs:[
  {task:"Your landlord hasn't fixed the heating in three weeks.",opts:[
   {t:"How do I write a complaint letter to a landlord?",why:"Advice, and then you still write it yourself."},
   {t:"Message my landlord: heating broken since 2 Nov, reported twice. Ask for a date.",ok:1,why:"Claude writes the real message. You just check it."},
   {t:"Heating broken since 2 Nov, landlord ignores me. What are my rights?",why:"Worth asking too, but it doesn't get the heating fixed."}]},
  {task:"You have a job interview on Friday.",opts:[
   {t:"Give me the 20 most common interview questions, with perfect answers to memorise.",why:"Memorised answers sound rehearsed. Reading isn't practice."},
   {t:"Be the interviewer. One question at a time, then tell me how to improve.",ok:1,why:"Practising out loud with feedback beats reading tips."},
   {t:"How do I stop being nervous in interviews?",why:"Helps a little. Practice helps more."}]},
  {task:"You want to eat better and spend less this week.",opts:[
   {t:"Some cheap, healthy recipes for two this week? We like Mediterranean food.",why:"Close, but you still plan the week and the list."},
   {t:"5 dinners for 2, €40 total, Spanish supermarket. Plus a shopping list.",ok:1,why:"The plan and the list, to a real budget."},
   {t:"Which supermarket in Spain is cheapest?",why:"A search question, not a plan."}]},
  {task:"You're learning Spanish.",opts:[
   {t:"Translate «Sorry, I'm running late» and «See you Monday» into Spanish.",why:"Handy, but Claude does the work and you learn little."},
   {t:"What's the best app for learning Spanish?",why:"Google habits. Claude can be the practice partner."},
   {t:"Chat with me in easy Spanish. Correct my mistakes in English.",ok:1,why:"A patient conversation partner, any time."}]}]},
 {name:"Blue",skill:"Show it things",type:"pick",intro:"Photos, screenshots, documents. Plus what you want from them.",
  qs:[
  {task:"Your laptop shows an error you don't understand.",opts:[
   {t:"It says «Your device ran into a problem», then a code 0x… something.",why:"The code you missed is the important part."},
   {t:"[screenshot] What does this mean? Simple steps, I'm not technical.",ok:1,why:"The screenshot has every detail. «Not technical» gets simpler steps."},
   {t:"Why do laptops get blue error screens?",why:"General. You need help with yours."}]},
  {task:"A long email from your child's school arrives.",opts:[
   {t:"[pasted email] Summarise this.",why:"Close, but you'd still have to dig out the to-dos."},
   {t:"[pasted email] What do I need to do, and by when?",ok:1,why:"Ask for what matters to you: actions and dates."},
   {t:"What do schools usually send before Christmas?",why:"It doesn't know what your school sent."}]},
  {task:"Your houseplant's leaves are turning yellow.",opts:[
   {t:"[photo]",why:"It can guess, but it can't see your watering or light."},
   {t:"[photo] Sunny window, watered every 3 days. Why yellow leaves?",ok:1,why:"The photo plus what the photo can't show."},
   {t:"Why do the leaves on houseplants go yellow, and how do I stop it?",why:"Ten possible causes, and you still won't know yours."}]},
  {task:"Abroad, a menu you can't read. You're allergic to nuts.",opts:[
   {t:"[photo of menu] Translate it and flag anything with nuts.",ok:1,why:"Translation plus the check you need. Still confirm with the waiter."},
   {t:"[photo of menu] Translate it.",why:"Half the job. Say what you care about."},
   {t:"How do I say «I'm allergic to nuts» in Portuguese?",why:"Useful too, but it doesn't read the menu."}]}]},
 {name:"Brown",skill:"Check what matters",type:"pick",intro:"Claude can be wrong and still sound sure. Know when to check.",
  qs:[
  {task:"You've had a strange pain for a few days.",opts:[
   {t:"Describe it in detail, follow Claude's advice, skip the doctor unless told.",why:"It can't examine you. Don't let it replace a doctor."},
   {t:"Use it to understand, and to prepare questions for my doctor.",ok:1,why:"Great for preparing. A doctor decides. If it's severe, get urgent help."},
   {t:"Ask in two chats. If they agree, skip the appointment.",why:"Two answers can share the same mistake."}]},
  {task:"You ask about yesterday's news or tomorrow's trains.",opts:[

     ${r.rewrite?`<strong>${U.stronger}</strong><div class="pane" style="margin-top:6px">${esc(r.rewrite)}</div>`:""}</div>
     <p class="small" style="margin:16px 0 0">${U.takeIt}</p><div class="row" style="margin-top:8px"><a class="btn red" id="ask" target="_blank" rel="noopener" href="${claudeUrl(U.coachMsg(sc,p))}">${U.askClaude}</a><a class="btn ghost" id="try" target="_blank" rel="noopener" href="${claudeUrl(p)}">${U.tryClaude}</a></div><div id="cp" class="small" aria-live="polite"></div>
     ${s?`<div class="row"><button class="btn" id="run">${U.run}</button></div><div id="ans"></div>`:""}`;
    const hook=(id,text)=>{$(id).onclick=()=>{copyText(text)};};hook("#ask",U.coachMsg(sc,p));hook("#try",p);
    if($("#run"))$("#run").onclick=async()=>{
      const rb=$("#run");rb.disabled=true;$("#ans").innerHTML=`<div class="pane" id="live" style="margin-top:12px">${U.thinking}</div>`;
      try{await s(p,{modelTier:"quick",cache:false,onText:({text})=>{$("#live").textContent=text}})}
      catch(e){$("#live").textContent=e&&e.code==="rate_limited"?U.limited:U.noReach}
      rb.disabled=false;};
  };
}

setLang(st.lang);say(U.hello);
resume();
}
</script>
</body>
</html>
