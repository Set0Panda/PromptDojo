<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly martial-arts dojo — encouraging sensei, short punchy rounds
   IDEA: earning belts; each belt is one Claude skill, the black belt is a real test
   PICTURE: the dojo wall — sensei character + belt rack that fills in as you progress
   COLOUR and TYPE: paper white, ink, vermilion accent, indigo support; Archivo 900 + Atkinson Hyperlegible
   LAYOUT: wall band on top, one training mat (card) below, feedback from the sensei bubble */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ef,#121726);--wall:light-dark(#e9e3d6,#1b2238);--ink:light-dark(#1b1a1f,#f1eee7);
--mute:light-dark(#5d5a63,#a9a8b6);--mat:light-dark(#ffffff,#1e2640);--line:light-dark(#d9d2c3,#2f3858);
--red:#e5432b;--indigo:light-dark(#273f7a,#8fa8ff);--ok:light-dark(#1f7a4a,#6fd6a0);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
h1{font-weight:900;font-size:clamp(32px,5vw,50px);letter-spacing:-.01em}
h2{font-weight:800;font-size:clamp(24px,3vw,32px)}
.band{padding:clamp(24px,4vw,52px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
.wall{background:var(--wall);border-bottom:6px solid var(--ink)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:end}
.lede{color:var(--mute);max-width:56ch;margin:12px 0 22px}
.rack{display:flex;gap:8px;flex-wrap:wrap}
.belt{flex:1 1 80px;min-width:76px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.belt i{display:block;height:20px;border-radius:4px;border:2px solid var(--ink);position:relative;opacity:.28}
.belt i::after{content:"";position:absolute;right:14px;top:-4px;width:10px;height:24px;background:inherit;border:2px solid var(--ink);border-radius:3px}
.belt.won i,.belt.open i{opacity:1}.belt.open:not(.won) i{opacity:.6}
.belt span{display:block;font-size:13px;margin-top:6px;color:var(--mute)}
.belt.cur span{color:var(--ink);font-weight:700}
.belt:focus-visible{outline:3px solid var(--red);outline-offset:4px;border-radius:4px}
.belt:disabled{cursor:not-allowed}
.sensei{position:relative}
.sensei svg{width:100%;height:auto;display:block}
.bubble{background:var(--mat);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:10px;position:relative;min-height:64px}
.bubble::after{content:"";position:absolute;bottom:-10px;left:60%;width:16px;height:16px;background:var(--mat);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.matcard{background:var(--mat);border:2px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,32px)}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-bottom:10px}
.pips{display:flex;gap:6px}.pips b{width:26px;height:8px;border-radius:4px;background:var(--line)}
.pips b.d{background:var(--indigo)}.pips b.c{background:var(--red)}
.task{background:var(--bg);border-left:5px solid var(--indigo);border-radius:8px;padding:12px 16px;margin:16px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;font:inherit;color:inherit;background:var(--mat);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:44px;white-space:pre-wrap}
.opt:hover:not(:disabled){border-color:var(--indigo)}
.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--mat))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--mat))}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg)}
.why strong{font-family:Archivo,sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.btn{display:inline-flex;align-items:center;text-decoration:none;font:700 16px Archivo,sans-serif;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:11px 20px;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font:inherit;font-size:15px;border:2px solid var(--line);background:var(--mat);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--indigo);background:color-mix(in srgb,var(--indigo) 14%,var(--mat))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:10px}
.pane{background:var(--bg);border-radius:12px;padding:14px 16px;font-size:15px;white-space:pre-wrap}
.pane h3{font-size:14px;font-weight:800;margin-bottom:8px;color:var(--mute)}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;width:0;background:var(--red);transition:width .4s}
textarea{width:100%;min-height:170px;font:16px/1.5 inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px;resize:vertical}
ul.fb{margin:6px 0 0;padding-left:20px}
.small{font-size:14px;color:var(--mute)}
.score{font:900 clamp(40px,7vw,64px) Archivo,sans-serif;color:var(--red);line-height:1}
.hide{display:none!important}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.belt.won.just i{animation:pop .5s}
@media(prefers-reduced-motion:reduce){.belt.won.just i{animation:none}.meter i{transition:none}}
@media(max-width:700px){.top{grid-template-columns:minmax(0,1fr)}.sensei{max-width:260px}.two{grid-template-columns:minmax(0,1fr)}}
</style>
<style>
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{font:16px inherit;font-family:inherit;color:var(--ink);background:var(--mat);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;min-height:44px}
.sub{font:800 18px Archivo,sans-serif;margin:6px 0 0;color:var(--red)}
.stage{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.themes{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px}
.themes h3{font-size:15px;color:var(--mute);margin:4px 0 2px}
.th{text-align:left;font:inherit;color:var(--ink);background:var(--mat);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
.th b{display:block;font-family:Archivo,sans-serif}.th small{display:block;color:var(--mute);font-size:13px;line-height:1.3}
.th em{font-style:normal;font-size:13px;color:var(--mute);float:right}
.th[aria-pressed=true]{border-color:var(--red);box-shadow:inset 5px 0 0 var(--red)}
.th:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media(max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}.themes{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}.themes h3{display:none}.th{flex:none;max-width:190px}}
.foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.foot .btn{padding:6px 14px;min-height:40px;font-size:14px}
</style>
</head>
<body>
<header class="band wall">
  <div class="wrap top">
    <div>
      <div class="topline"><h1>Prompt Dojo</h1><select class="lang hide" id="lang" aria-label="Language"></select></div>
      <p class="sub" id="sub"></p>
      <p class="lede" id="lede"></p>
      <div class="rack" id="rack"></div>
    </div>
    <div class="sensei">
      <div class="bubble" id="say" aria-live="polite"></div>
      <svg viewBox="0 0 220 170" aria-hidden="true">
        <ellipse cx="110" cy="162" rx="70" ry="7" fill="currentColor" opacity=".12"/>
        <path d="M45 160 Q40 95 110 92 Q180 95 175 160 Z" fill="#273f7a"/>
        <path d="M80 98 L110 140 L140 98" fill="none" stroke="#f6f4ef" stroke-width="7"/>
        <rect x="55" y="128" width="110" height="12" rx="3" fill="#1b1a1f"/>
        <rect x="128" y="126" width="12" height="30" rx="3" fill="#1b1a1f" transform="rotate(12 134 140)"/>
        <circle cx="110" cy="58" r="44" fill="#f2c9a0"/>
        <path d="M68 50 Q110 4 152 50 Q130 30 110 32 Q90 30 68 50Z" fill="#e9e3d6"/>
        <path d="M72 62 Q60 82 74 104 Q82 84 80 66Z M148 62 Q160 82 146 104 Q138 84 140 66Z" fill="#e9e3d6"/>
        <path d="M92 58 q6 -6 12 0 M116 58 q6 -6 12 0" stroke="#1b1a1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M86 78 Q110 112 134 78 Q110 90 86 78Z" fill="#f6f4ef"/>
        <circle cx="88" cy="70" r="5" fill="#e5432b" opacity=".35"/><circle cx="132" cy="70" r="5" fill="#e5432b" opacity=".35"/>
      </svg>
    </div>
  </div>
</header>

<main class="band">
  <div class="wrap"><div class="stage"><nav class="themes" id="themes" aria-label="Themes"></nav><div class="matcard" id="mat"></div></div>
  <div class="foot small"><span id="note"></span><button class="btn ghost" id="reset"></button></div></div>
</main>

<script>
{
/* ===== All text lives here. To add a language, copy the "en" block, translate the values, and add it to LANGS. ===== */
const LANGS={en:{
 langName:"English",aiLang:"English",
 ui:{sub:"AI is not Google",beltOf:n=>`${n} belt`,themesLabel:"Pick a theme",saved:n=>`Your ${n} progress is saved. Come back any time.`,resumed:n=>`Welcome back to ${n}. Carrying on where you left off.`,inProgress:"in progress",lede:"Most people type into AI like it's a search box. Seven quick belts show you how to talk to it instead, and get answers that actually fit your life.",
  hello:"Welcome, student. Pick the first belt and let's begin.",note:"Progress is saved in this browser. The black-belt test sends your message to Claude, so it asks permission the first time.",
  reset:"Start over",resetDone:"Progress cleared. Ready for the next student.",belt:"belt",earned:"earned",locked:"locked",
  pickQ:"Which message gets the more useful answer?",situation:"Situation",right:"Exactly. Notice why it works.",wrong:"Not quite. Look at the green one.",
  next:"Next",finish:"Finish belt",gotIt:"Right.",catch:"Here's the catch.",better:"The better one",
  buildQ:"Build the message",task:"Task",buildHint:"Tap pieces to add them. Watch Claude's likely answer change.",quality:"How useful the answer will be",
  yourMsg:"Your message",likely:"Claude's likely answer",check:"Check my message",clean:"Great message.",almost:"Almost.",
  cleanWhy:"Who it's for, what you've got, the limits, what you want back. That's the difference between searching and asking.",
  fluff:"Drop the extras: hype words add pressure, not information, and details that don't change the plan just add noise. Ask yourself: would this change what Claude suggests?",missing:"Still missing:",
  buildOk:"Every piece earns its place. Well done.",buildNo:"Each piece should tell Claude something it couldn't guess.",
  won:n=>`${n} belt earned`,notYet:"Not this time",unlocked:s=>`Habit unlocked: ${s}.`,need:(n,t)=>`You need ${n} of ${t}. The explanations are the real lesson. Have another go.`,
  goNext:n=>`Next: ${n} belt`,retry:"Retry",bow:"Bow to your new belt.",fail:"Every master failed more times than the student has tried.",
  freeQ:"Write it yourself",freeLabel:"Your message to Claude (make up any details you need)",freePh:"Write it like you'd explain it to a helpful friend…",
  grade:"Score my message",grading:"Scoring…",study:"Let me study this…",empty:"Write something first, student.",again:"Score again",
  blackOk:"A black belt. The dojo has nothing more to teach you, only practice.",blackNo:"Good start. Read the tips and try again.",
  byClaude:"Scored by Claude",offline:"Quick offline check (Claude scoring isn't available here)",pass:"75 to pass",works:"What works",improve:"To improve",stronger:"A stronger version",
  run:"Send it to Claude for real",askClaude:"Get feedback in Claude",tryClaude:"Try it in Claude",copied:"Copied. If Claude opens with an empty box, just paste.",copyFail:"Couldn't copy automatically. Select the text below and copy it.",takeIt:"Take it to your own Claude (free account works):",
  coachMsg:(sc,p)=>`I'm practising writing better messages to AI assistants.\n\nThe situation: ${sc}\n\nMy message:\n"""\n${p}\n"""\n\nPlease (1) score my message out of 100 for how likely it is to get a genuinely useful, personal answer, (2) tell me what works, (3) give me up to 3 concrete fixes, and (4) show me an improved version. Keep it friendly and plain. Then (5) answer my original message as if I'd sent it.`,thinking:"Thinking…",limited:"Too many requests right now. Wait a minute and try again.",noReach:"Couldn't reach Claude from here.",other:"Different situation",
  h:{long:"Enough detail to work with.",short:"Add more detail. Claude is guessing a lot.",num:"Includes specifics like numbers or dates.",noNum:"Add specifics: dates, amounts, ages, budget.",
   me:"Tells Claude about your situation.",noMe:"Say who it's for and what your situation is.",fmt:"Says what you want back.",noFmt:"Say what you want back: a list, a short message, steps…",
   hype:"Cut words like \"perfect\" or \"amazing\". They add pressure, not information."},
  rx:{me:/\b(i|i'm|my|we|our|me)\b/i,fmt:/(list|steps|short|words|plan|ideas|table|message|email|explain|options)/i,hype:/(perfect|amazing|best ever|!!!)/i}},
 belts:[
 {name:"White",skill:"Talk, don't search",type:"pick",intro:"Google needs keywords. Claude understands your situation, but only the facts you give it. Adjectives aren't facts.",
  qs:[
  {task:"You want something for dinner tonight.",opts:[
   {t:"Give me 3 quick, healthy and really delicious chicken dinner ideas that are family-friendly and easy to make tonight.",why:"It sounds detailed, but it's all adjectives. Claude still doesn't know what's in your fridge, how long you have, or what your kids won't eat."},
   {t:"I've got chicken thighs, rice, a lemon and spinach. 30 minutes, two kids who hate spicy food. 3 ideas?",ok:1,why:"Shorter, but every word is a fact Claude can use: ingredients, time, who's eating, what to avoid."},
   {t:"What can I cook with chicken tonight? I'm cooking for my family and I'm really tired, it's been a long day at work.",why:"Personal and friendly, but the facts that shape the answer (what you have, how long, any dislikes) are missing."}]},
  {task:"You got an official letter full of jargon and you're not sure what it wants.",opts:[
   {t:"I got a letter from the tax office about my 2025 return, reference AB-2231-X, and it mentions a \"requerimiento\". What does it mean and what should I do?",why:"Lots of detail, but Claude can't look up your reference number, and it hasn't seen what the letter actually says. It can only explain the word in general."},
   {t:"[photo of the letter] What is this asking me to do, and is there a deadline?",ok:1,why:"The shortest option wins. Show Claude the real letter and ask exactly what you need."},
   {t:"Can you explain what tax office letters usually mean and what people should do when they get one?",why:"A general question gets a general answer. Ask about your letter, not letters."}]},
  {task:"You want to buy a new phone.",opts:[
   {t:"I need a new phone with the best camera, the best battery, the biggest screen and the fastest processor, but it has to be cheap.",why:"Detailed but contradictory. Something has to give, and Claude will choose what to sacrifice for you. Say what matters most."},
   {t:"My Samsung is 4 years old and getting slow. My friend has an iPhone and loves it. Which phone should I get?",why:"Real context, but no budget and no idea how you use your phone. You'll get a generic comparison."},
   {t:"Max €350. Mostly WhatsApp and photos of my kids, battery must last all day, I hate big phones. 2–3 options and the trade-offs?",ok:1,why:"Budget, how you use it, your priorities and what you dislike, and asking for trade-offs instead of one \"best\"."}]},
  {ask:"What's the most useful thing to add?",msg:"Write a message to my boss asking for Friday off.",task:"You're about to send this to Claude.",opts:[
   {t:"\"Make it sound professional and polite.\"",why:"Claude would do that anyway. It doesn't give your boss a reason to say yes."},
   {t:"\"It's for my sister's wedding, and Marta has agreed to cover my shift.\"",ok:1,why:"The reason and the solution to your boss's main worry (who covers). That's what gets a yes."},
   {t:"\"My boss is called Laura and she's been my manager for two years.\"",why:"A nice touch for the greeting, but it doesn't change whether she agrees."}]}]},
 {name:"Yellow",skill:"Give it the details",type:"build",intro:"Build a message from the pieces. Some sound useful but aren't. Only pick what changes the answer."},
 {name:"Orange",skill:"Keep the conversation going",type:"pick",intro:"Unlike a search, Claude remembers what you've said. Reply to it, correct it, build on it. Don't start again.",
  qs:[
  {task:"Claude's explanation of how a mortgage works was too complicated for you.",opts:[
   {t:"Simpler, please. Explain it like I'm 12, with an example using real numbers.",ok:1,why:"Say what was wrong and what you want instead. Claude adjusts on the spot."},
   {t:"Can you give me a link to a website that explains mortgages more simply?",why:"Back to searching. Claude can simplify it right here, as many times as you need."},
   {t:"Open a new chat and ask \"explain mortgages\" again, hoping for a simpler answer.",why:"Same question, probably the same level of answer. Telling it you need simpler is what changes things."}]},
  {task:"Claude gave you three recipes. You like the second one, but your dinner guest is vegetarian.",opts:[
   {t:"Start a new chat so the chicken recipes don't confuse it.",why:"A common myth. The earlier messages help, because they're what it builds on."},
   {t:"Give me a vegetarian recipe with rice, spinach and lemon for 4 people, ready in 30 minutes, that kids will like.",why:"It works, but you've retyped everything and lost the recipe you actually liked."},
   {t:"Make the second one vegetarian and tell me what to buy.",ok:1,why:"It remembers the recipes. Point to the one you want and say what to change."}]},
  {task:"Claude wrote a message to your noisy neighbour. It's well written but sounds a bit aggressive.",opts:[
   {t:"That's wrong.",why:"Claude knows you're unhappy, not why. It might change the wrong things."},
   {t:"Good, but softer. I still have to live next to them. Keep the part about the times.",ok:1,why:"What's good, what to change, why, and what to keep. Twelve words that fix it."},
   {t:"Rewrite it.",why:"You'll get a different version, but not necessarily a gentler one."}]},
  {task:"You want help planning a weekend away, but you're not sure what details matter.",opts:[
   {t:"I want to plan a weekend away. Before you suggest anything, ask me the questions you need, one at a time.",ok:1,why:"Let Claude interview you. It knows which details matter, so you don't have to guess."},
   {t:"Plan a romantic weekend in Seville for our anniversary. We love food and walking. Make it really special.",why:"A decent start, but you've guessed at what matters and left out budget, dates and how you're travelling. Claude will fill those in for you."},
   {t:"What details should I include when asking an AI to plan a trip?",why:"Close, but you'll get a checklist to fill in yourself. Letting it ask you is quicker."}]}]},
 {name:"Green",skill:"Let it do the job",type:"pick",intro:"Google finds pages about how to do something. Claude can do the thing itself: write it, plan it, practise it with you.",
  qs:[
  {task:"Your landlord hasn't fixed the heating after three weeks.",opts:[
   {t:"How do I write a good complaint letter to a landlord? What should it include?",why:"Useful advice, but then you still have to write it. Claude can write it."},
   {t:"Write a firm, polite message to my landlord: heating broke 2 Nov, reported 3 Nov and 10 Nov, still not fixed. Ask for a repair date this week.",ok:1,why:"Claude writes the actual message with your dates, ready to send. You just check it."},
   {t:"My landlord won't fix the heating. It broke on 2 November and I've reported it twice since. What are my rights as a tenant in Spain?",why:"A good question to ask too, as long as you check anything legal. But it doesn't get the heating fixed. You still need the message."}]},
  {task:"You have a job interview on Friday and you're nervous.",opts:[
   {t:"Give me the 20 most common interview questions for a hotel receptionist job, with the perfect answer to each so I can memorise them.",why:"Plausible, but memorised \"perfect\" answers sound rehearsed, and reading isn't practising."},
   {t:"Be the interviewer for a hotel receptionist job. Ask one question at a time, wait for my answer, then tell me how to improve it.",ok:1,why:"Claude can role-play. Practising out loud with feedback beats reading tips."},
   {t:"What are the best tips for being less nervous in a job interview?",why:"It'll help a little. Practice is what actually reduces the nerves."}]},
  {task:"You want to eat better and spend less on food this week.",opts:[
   {t:"Give me some cheap, healthy recipes I could cook this week for two people. We like Mediterranean food and don't eat much red meat.",why:"Close. But you still have to choose, plan the days and write the shopping list, and \"cheap\" isn't a number."},
   {t:"5 dinners for 2 adults, about €40 total, from a normal Spanish supermarket. Then one shopping list grouped by aisle.",ok:1,why:"It does the planning and the list in one go, to a real budget."},
   {t:"Which Spanish supermarket is cheapest for healthy food?",why:"A search question. Fine to know, but it's not a plan."}]},
  {task:"You're learning Spanish and want to improve.",opts:[
   {t:"Translate these into Spanish so I can use them at work: \"Could you send me the report by Friday?\" and \"Sorry, I'm running late.\"",why:"Handy, but Claude does the work and you learn very little."},
   {t:"What's the best app for learning Spanish?",why:"Google behaviour. Claude can be the practice partner itself."},
   {t:"Chat with me in simple Spanish about my weekend. After each reply, correct my mistakes in English.",ok:1,why:"A patient conversation partner, any time, that corrects you. Most people never think to use it this way."}]}]},
 {name:"Blue",skill:"Show it things",type:"pick",intro:"You can give Claude photos, screenshots and documents, but it still needs to know what you want from them.",
  qs:[
  {task:"Your laptop shows an error message you don't understand.",opts:[
   {t:"My laptop says \"Your device ran into a problem and needs to restart\", then a code starting with 0x… I didn't catch the rest. Windows 11.",why:"Good effort, but the code you didn't catch is the most important part."},
   {t:"[screenshot] What does this mean? Give me the fix step by step. I'm not technical.",ok:1,why:"The screenshot captures every detail, and \"I'm not technical\" gets you simpler steps."},
   {t:"Why do laptops show blue error screens and how can I stop it?",why:"A general question. You need help with your error."}]},
  {task:"You received a long email from your child's school and don't have time to read it.",opts:[
   {t:"[pasted email] Summarise this.",why:"Close. A summary is shorter, but you still have to dig the to-dos out of it."},
   {t:"[pasted email] What do I actually need to do, and by when?",ok:1,why:"Same effort, better question. Ask for the part that matters to you: actions and dates."},
   {t:"What kind of things do schools usually send home before Christmas?",why:"It doesn't know what your school sent until you show it."}]},
  {task:"Your houseplant's leaves are going yellow.",opts:[
   {t:"[photo]",why:"Claude can guess from a photo alone, but your watering and light are often what explain it, and it can't see those."},
   {t:"[photo] It's near a sunny window and I water it every 3 days. Why are the leaves going yellow?",ok:1,why:"Photo plus the facts the photo can't show. Now it can actually diagnose it."},
   {t:"Why do plant leaves go yellow?",why:"You'll get the ten most common reasons, and you still won't know which one is yours."}]},
  {task:"You're abroad and the menu is in a language you can't read. You're allergic to nuts.",opts:[
   {t:"[photo of menu] Translate this and flag anything that might contain nuts.",ok:1,why:"Photo in, translation out, plus the check that matters to you. Still confirm with the waiter: Claude can't see the kitchen."},
   {t:"[photo of menu] Translate this.",why:"Half the job. Tell it what you care about and it will look for it."},
   {t:"How do you say \"I'm allergic to nuts\" in Portuguese?",why:"Worth knowing too, but it doesn't help you read the menu."}]}]},
 {name:"Brown",skill:"Check what matters",type:"pick",intro:"Claude is very capable, and it can still be wrong, sometimes very confidently. Know when to double-check.",
  qs:[
  {task:"You've had a strange pain for a few days and you ask Claude about it.",opts:[
   {t:"Describe every symptom in detail, follow whatever Claude suggests, and skip the doctor unless it tells you to go.",why:"Claude can't examine you or see your history. Don't let it replace a doctor."},
   {t:"Use it to understand what might be going on and prepare questions for your doctor.",ok:1,why:"Great for understanding and preparing. A professional makes the call, and if it's severe, get urgent help."},
   {t:"Ask the same question again in a new chat, and if both answers agree with each other, trust them and save yourself the appointment.",why:"Two answers from the same source can share the same mistake. Agreement isn't proof."}]},
  {task:"You ask about yesterday's news or tomorrow's train times.",opts:[
   {t:"Trust its answer. It sounds sure.",why:"Claude's built-in knowledge stops at a certain date. It may sound certain and still be out of date."},
   {t:"Ask it to search the web, then check the official site before you act on it.",ok:1,why:"For anything recent or changing, get a live search and a real source."},
   {t:"Ask it how sure it is about the times, and if it says it's very confident, trust the answer and plan your day around it.",why:"Confidence isn't evidence. A wrong answer can come with high confidence."}]},
  {task:"Claude summarised a long contract for you, and you're going to rely on it.",opts:[
   {t:"Trust the summary. It read every page, and it's more careful than you'd be reading it yourself at 11pm.",why:"Summaries can miss or soften a key detail, and in a contract the details are the point."},
   {t:"Ask it to quote the exact lines behind each key point, then read those lines yourself.",ok:1,why:"Make it show its evidence, then check the parts that matter. It's fast and catches mistakes."},
   {t:"Don't use AI for contracts at all.",why:"It's genuinely useful for understanding them. Just verify before you rely on it."}]},
  {task:"Claude tells you something you're fairly sure is wrong.",opts:[
   {t:"Keep telling it \"you're wrong, check again\" until it changes its answer and agrees with what you think.",why:"Pressure without reasons can make it agree just to please you. Then you've learned nothing."},
   {t:"Accept it. It probably knows better.",why:"You know things it doesn't. Speak up."},
   {t:"Explain what you think is wrong and why, and ask it to check again.",ok:1,why:"Give it your reasons. It will reconsider, and either correct itself or explain why it's sure."}]}]},

 belts:[
 {name:"Blanco",skill:"Habla, no busques",type:"pick",intro:"Google necesita palabras clave. Claude entiende tu situación, pero solo con los datos que le des. Los adjetivos no son datos.",
  qs:[
  {task:"Quieres algo para cenar esta noche.",opts:[
   {t:"Dame 3 ideas de cena con pollo que sean rápidas, sanas, muy ricas, para toda la familia y fáciles de hacer esta noche.",why:"Parece detallado, pero son todo adjetivos. Claude sigue sin saber qué tienes en la nevera, cuánto tiempo tienes o qué no comen tus hijos."},
   {t:"Tengo contramuslos de pollo, arroz, un limón y espinacas. 30 minutos, dos niños que odian el picante. ¿3 ideas?",ok:1,why:"Más corto, pero cada palabra es un dato que Claude puede usar: ingredientes, tiempo, quién come y qué evitar."},
   {t:"¿Qué puedo cocinar esta noche con pollo? Cocino para mi familia y estoy muy cansado, ha sido un día muy largo en el trabajo.",why:"Cercano y personal, pero faltan los datos que deciden la respuesta: qué tienes, cuánto tiempo y qué no gusta."}]},
  {task:"Te ha llegado una carta oficial llena de jerga y no sabes qué te piden.",opts:[
   {t:"Me ha llegado una carta de Hacienda sobre mi renta de 2025, con referencia AB-2231-X, y habla de un «requerimiento». ¿Qué significa y qué hago?",why:"Mucho detalle, pero Claude no puede consultar tu número de referencia y no ha visto lo que dice la carta. Solo puede explicarte la palabra en general."},
   {t:"[foto de la carta] ¿Qué me piden que haga y hay algún plazo?",ok:1,why:"La opción más corta gana. Enséñale la carta real y pregunta exactamente lo que necesitas."},
   {t:"¿Me puedes explicar qué suelen significar las cartas de Hacienda y qué debería hacer la gente cuando recibe una?",why:"Una pregunta general da una respuesta general. Pregunta por tu carta, no por las cartas."}]},
  {task:"Quieres comprarte un móvil nuevo.",opts:[
   {t:"Necesito un móvil nuevo con la mejor cámara, la mejor batería, la pantalla más grande y el procesador más rápido, pero tiene que ser barato.",why:"Detallado pero contradictorio. Algo hay que sacrificar, y Claude elegirá por ti. Di qué te importa más."},
   {t:"Mi Samsung tiene 4 años y va lento. Mi amiga tiene un iPhone y le encanta. ¿Qué móvil me compro?",why:"Contexto real, pero sin presupuesto ni idea de cómo usas el móvil. Te dará una comparación genérica."},
   {t:"Máximo 350 €. Sobre todo WhatsApp y fotos de mis hijos, la batería tiene que durar todo el día y odio los móviles grandes. ¿2 o 3 opciones y sus pros y contras?",ok:1,why:"Presupuesto, cómo lo usas, tus prioridades y lo que no te gusta, y pides comparar opciones en vez de «el mejor»."}]},
  {ask:"¿Qué es lo más útil que puedes añadir?",msg:"Escribe un mensaje a mi jefa pidiendo el viernes libre.",task:"Estás a punto de enviarle esto a Claude.",opts:[
   {t:"«Que suene profesional y educado.»",why:"Claude ya lo haría. No le da a tu jefa ningún motivo para decir que sí."},
   {t:"«Es para la boda de mi hermana, y Marta ha aceptado cubrir mi turno.»",ok:1,why:"El motivo y la solución a la principal preocupación de tu jefa (quién te cubre). Eso es lo que consigue un sí."},
   {t:"«Mi jefa se llama Laura y lleva dos años siendo mi responsable.»",why:"Queda bien en el saludo, pero no cambia que te diga que sí."}]}]},
 {name:"Amarillo",skill:"Dale los detalles",type:"build",intro:"Monta un mensaje con piezas. Algunas parecen útiles pero no lo son. Elige solo las que cambian la respuesta."},
 {name:"Naranja",skill:"Sigue la conversación",type:"pick",intro:"A diferencia de un buscador, Claude recuerda lo que le has dicho. Contéstale, corrígele, construye sobre lo que hay. No empieces de cero.",
  qs:[
  {task:"La explicación de Claude sobre cómo funciona una hipoteca te ha resultado demasiado complicada.",opts:[
   {t:"Más sencillo, por favor. Explícamelo como si tuviera 12 años, con un ejemplo con números reales.",ok:1,why:"Di qué falló y qué quieres en su lugar. Claude se adapta al momento."},
   {t:"¿Me puedes dar un enlace a una web que explique las hipotecas de forma más sencilla?",why:"Vuelta a buscar. Claude te lo puede simplificar aquí mismo, todas las veces que haga falta."},
   {t:"Abro un chat nuevo y vuelvo a preguntar «explícame las hipotecas», a ver si sale más sencillo.",why:"La misma pregunta probablemente da el mismo nivel de respuesta. Lo que cambia las cosas es decirle que lo necesitas más sencillo."}]},
  {task:"Claude te ha dado tres recetas. Te gusta la segunda, pero tu invitada es vegetariana.",opts:[
   {t:"Abro un chat nuevo para que las recetas con pollo no lo confundan.",why:"Un mito muy común. Los mensajes anteriores ayudan, porque son la base sobre la que construye."},
   {t:"Dame una receta vegetariana con arroz, espinacas y limón para 4 personas, lista en 30 minutos y que les guste a los niños.",why:"Funciona, pero lo has vuelto a escribir todo y has perdido la receta que te gustaba."},
   {t:"Haz la segunda vegetariana y dime qué tengo que comprar.",ok:1,why:"Recuerda las recetas. Señala la que quieres y di qué cambiar."}]},
  {task:"Claude ha escrito un mensaje para tu vecino ruidoso. Está bien escrito, pero suena un poco agresivo.",opts:[
   {t:"Está mal.",why:"Claude sabe que no te gusta, pero no por qué. Puede que cambie lo que no era."},
   {t:"Bien, pero más suave. Tengo que seguir viviendo al lado. Mantén lo de los horarios.",ok:1,why:"Qué está bien, qué cambiar, por qué y qué mantener. Pocas palabras que lo arreglan."},
   {t:"Reescríbelo.",why:"Te dará otra versión, pero no necesariamente más amable."}]},
  {task:"Quieres ayuda para planear una escapada de fin de semana, pero no sabes qué detalles importan.",opts:[
   {t:"Quiero planear una escapada de fin de semana. Antes de sugerirme nada, hazme las preguntas que necesites, de una en una.",ok:1,why:"Deja que Claude te entreviste. Sabe qué detalles importan, así no tienes que adivinarlos."},
   {t:"Planea un fin de semana romántico en Sevilla por nuestro aniversario. Nos encanta comer bien y pasear. Que sea muy especial.",why:"Buen comienzo, pero has supuesto qué importa y te has dejado el presupuesto, las fechas y cómo vais a viajar. Claude se lo inventará."},
   {t:"¿Qué detalles debería incluir cuando le pido a una IA que me planee un viaje?",why:"Cerca, pero tendrás una lista para rellenar tú. Dejar que te pregunte es más rápido."}]}]},
 {name:"Verde",skill:"Deja que haga el trabajo",type:"pick",intro:"Google encuentra páginas que explican cómo hacer algo. Claude puede hacerlo: escribirlo, planificarlo, practicarlo contigo.",
  qs:[
  {task:"Tu casero no ha arreglado la calefacción en tres semanas.",opts:[

    {t:"[captura] Ayuda.",why:"¿Ayuda con qué? Di tu objetivo."},
    {t:"¿Qué opciones gráficas debería usar para jugar?",why:"Depende del juego y de tu equipo."}]},
   {task:"Has encontrado una carta coleccionable antigua y te preguntas cuánto vale.",opts:[
    {t:"[foto de la carta] ¿Cuánto vale?",why:"Cerca, pero los precios cambian constantemente. Lo que Claude sabe de serie puede estar muy desfasado."},
    {t:"[foto de la carta] ¿Qué carta y de qué colección es? Luego busca precios de venta recientes.",ok:1,why:"Identifica la carta y luego busca precios reales en vez de adivinar."},
    {t:"¿Cuánto valen hoy en día las cartas coleccionables antiguas?",why:"Desde céntimos hasta miles de euros. Enséñale la tuya."}]},
   {task:"Un patrón de ganchillo está lleno de abreviaturas.",opts:[
    {t:"¿Cómo se leen los patrones de ganchillo?",why:"Una lección general, cuando necesitas ayuda con este patrón."},
    {t:"[foto del patrón]",why:"Puede leerlo, pero ¿quieres una explicación, una traducción, una revisión?"},
    {t:"[foto del patrón] Explícamelo vuelta a vuelta para principiantes. ¿Qué significa «2pbj»?",ok:1,why:"Enséñalo y di tu nivel y lo que necesitas."}]}],
  [{task:"Claude te dice dónde está un objeto secreto de un juego que salió el mes pasado.",opts:[
    {t:"Me fío. Ha descrito el sitio exacto con muchísimo detalle.",why:"El detalle se puede inventar. Un juego tan nuevo puede ser posterior a lo que Claude sabe de serie."},
    {t:"Le pido que busque en internet, o miro una guía, porque el juego es muy nuevo.",ok:1,why:"Para lo reciente, búsqueda en directo o una fuente."},
    {t:"Se lo vuelvo a preguntar y, si dice lo mismo, me fío.",why:"Puede repetir la misma respuesta inventada."}]},
   {task:"Claude dice que tu carta rara vale unos 500 €.",opts:[
    {t:"Miro yo mismo las ventas recientes antes de comprar o vender.",ok:1,why:"Los precios reales salen de ventas reales, hoy."},
    {t:"La pongo a la venta por 500 € ahora mismo.",why:"Podrías venderla muy por debajo o muy por encima de su precio."},
    {t:"Le pregunto a Claude si está seguro y la vendo si dice que sí.",why:"Estar seguro no hace que el precio sea actual."}]},
   {task:"Claude explica una regla de un juego de mesa de forma distinta al reglamento.",opts:[
    {t:"Me quedo con la versión de Claude. Se ha leído muchos más reglamentos que tú y que todos tus amigos juntos.",why:"Puede estar mezclando otra edición u otro juego."},
    {t:"Manda el reglamento. Le enseño la página a Claude y le pido que me vuelva a explicar esa regla.",ok:1,why:"La fuente real gana a la memoria. Claude explica genial una página que le enseñas."},
    {t:"Discutirlo con tus amigos hasta que alguien se rinda.",why:"Un clásico. No es lo más rápido."}]}]],
  build:{task:"Conseguir recomendaciones de juegos que de verdad te vayan.",base:"Recomiéndame un juego.",
   chips:[
    {id:"a",t:"Me encantaron Stardew Valley y Animal Crossing",good:1},
    {id:"b",t:"Juego en Nintendo Switch",good:1},
    {id:"c",t:"Solo 30 minutos por la noche",good:1},
    {id:"d",t:"Nada de miedo ni violencia",good:1},
    {id:"e",t:"3 opciones, una línea cada una explicando por qué encaja",good:1},
    {id:"x",t:"Tiene que ser el mejor juego de la historia",good:0},
    {id:"y",t:"Mi hermano juega a shooters",good:0},
    {id:"z",t:"Juego desde los 8 años",good:0}],
   replies:["Entre los mejores juegos de la historia están los RPG épicos de mundo abierto, los shooters competitivos más intensos y los clásicos legendarios de terror…",
    "Aquí tienes algunos juegos populares: una gran aventura de mundo abierto, el último juego de fútbol, un battle royale…",
    "Como te gustan los juegos tranquilos en Switch, podría encajarte un juego de granja o de simulación de vida…",
    "1. Un simulador acogedor de granja y amistad: los días del juego son cortos, perfecto para sesiones de 30 minutos.\n2. Un puzle tranquilo de construir islas: no se puede perder y relaja mucho.\n3. Un juego relajante de cocinar y decorar: fácil de empezar y dejar.\nTodos en Switch, sin miedo ni violencia. (Pídeme que busque los precios actuales.)"]},
  free:["Quieres organizar una noche de juegos tranquila para 6 amigos que no suelen jugar a juegos de mesa.","Quieres empezar una afición nueva, como dibujar o tocar la guitarra, con 20 minutos al día.","Necesitas ayuda para elegir unos auriculares para jugar sin gastar mucho."]}
 ],
 free:["Quieres ayuda para decidir si reparar o cambiar tu lavadora vieja.","Quieres empezar a aprender un idioma nuevo con 15 minutos al día.","Tienes que escribir a un vecino por el ruido de madrugada sin empezar una guerra."]
}
};
const BELT_COL=["#ffffff","#f2c230","#f08a24","#3aa35b","#2f6fd6","#8a5a34","#1b1a1f"];

const $=s=>document.querySelector(s), mat=$("#mat"), say=t=>$("#say").textContent=t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={won:{},pos:{},cur:0,lang:"en",theme:"everyday"};
let hadSave=false;try{const s=JSON.parse(localStorage.getItem("pdojo3")||"null");if(s&&s.won){st=Object.assign(st,s);hadSave=true}}catch(e){}
if(!hadSave){try{if(/^es\b/i.test(navigator.language||""))st.lang="es"}catch(e){}}
if(Array.isArray(st.won))st.won={everyday:st.won};if(!st.won||typeof st.won!=="object")st.won={};if(!st.pos||typeof st.pos!=="object")st.pos={};if(!LANGS[st.lang])st.lang="en";
const save=()=>{try{localStorage.setItem("pdojo3",JSON.stringify(st))}catch(e){}};
let L,U,BELTS;
const W=()=>st.won[st.theme]||(st.won[st.theme]=[]);
const open=i=>i===0||W().includes(i-1)||W().includes(i);
const TH=()=>L.themes.find(t=>t.id===st.theme)||L.themes[0];
const qsOf=i=>TH().qs?TH().qs[i]:BELTS[i].qs;
const buildOf=()=>TH().build||L.build, freeOf=()=>TH().free||L.free;
function resume(){const p=st.pos[st.theme];if(p&&BELTS[p.i]&&BELTS[p.i].type==="pick"){st.cur=p.i;rack();pick(p.i,p.q,p.right)}else{rack();start(Math.min(st.cur||0,BELTS.length-1),true)}}
function themes(){
  $("#themes").innerHTML=`<h3>${U.themesLabel}</h3>`+L.themes.map(t=>`<button class="th" aria-pressed="${t.id===st.theme}" data-t="${t.id}"><em>${(st.won[t.id]||[]).length}/7${st.pos[t.id]&&t.id!==st.theme?" · "+U.inProgress:""}</em><b>${esc(t.name)}</b><small>${esc(t.blurb)}</small></button>`).join("");
}
$("#themes").addEventListener("click",e=>{const b=e.target.closest(".th");if(!b||b.dataset.t===st.theme)return;
  const from=TH().name;st.theme=b.dataset.t;const p=st.pos[st.theme],w=W();
  if(p&&BELTS[p.i]&&BELTS[p.i].type==="pick"){st.cur=p.i;save();rack();pick(p.i,p.q,p.right);say(U.resumed(TH().name))}
  else{st.cur=w.length?Math.min(Math.max(...w)+1,6):0;save();start(st.cur,true);say(U.saved(from))}});

function setLang(code){
  st.lang=code;L=LANGS[code];U=L.ui;BELTS=L.belts;save();
  document.documentElement.lang=code;
  $("#sub").textContent=U.sub;$("#lede").textContent=U.lede;$("#note").textContent=U.note;$("#reset").textContent=U.reset;
  const sel=$("#lang"),keys=Object.keys(LANGS);
  sel.innerHTML=keys.map(k=>`<option value="${k}" ${k===code?"selected":""}>${esc(LANGS[k].langName)}</option>`).join("");
  sel.classList.toggle("hide",keys.length<2);
}
$("#lang").onchange=e=>{setLang(e.target.value);resume();say(U.hello)};

function rack(just){
  themes();
  $("#rack").innerHTML=BELTS.map((b,i)=>`<button class="belt ${W().includes(i)?"won":""} ${open(i)?"open":""} ${i===st.cur?"cur":""} ${i===just?"just":""}" data-i="${i}" ${open(i)?"":"disabled"} aria-label="${esc(U.beltOf(b.name))}: ${esc(b.skill)}${W().includes(i)?` (${U.earned})`:open(i)?"":` (${U.locked})`}"><i style="background:${BELT_COL[i]}"></i><span>${esc(b.name)}</span></button>`).join("");
}
$("#rack").addEventListener("click",e=>{const b=e.target.closest(".belt");if(b&&!b.disabled)start(+b.dataset.i)});
$("#reset").onclick=()=>{st.won[st.theme]=[];delete st.pos[st.theme];st.cur=0;save();say(U.resetDone);start(0,true)};

function head(b,n,total){
  return `<div class="meta"><span>${esc(U.beltOf(b.name))} · ${esc(b.skill)}</span>${total?`<span class="pips">${Array.from({length:total},(_,k)=>`<b class="${k<n?"d":k===n?"c":""}"></b>`).join("")}</span>`:""}</div>`;
}
function start(i,quiet){st.cur=i;save();rack();const b=BELTS[i];if(!quiet)say(b.intro);
  if(b.type==="pick")pick(i,0,0);else if(b.type==="build")build(i);else free(i);}

function pick(i,q,right){
  const b=BELTS[i],QS=qsOf(i),Q=QS[q];st.pos[st.theme]={i,q,right};save();
  const order=Q.opts.map((o,k)=>k).sort(()=>Math.random()-.5);
  mat.innerHTML=head(b,q,QS.length)+`<h2>${esc(Q.ask||U.pickQ)}</h2>
   <div class="task"><strong>${U.situation}:</strong> ${esc(Q.task)}${Q.msg?`<div class="pane" style="margin-top:10px">${esc(Q.msg)}</div>`:""}</div>
   <div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(Q.opts[k].t)}</button>`).join("")}</div><div id="why"></div>`;
  mat.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const o=Q.opts[+btn.dataset.k],good=!!o.ok;if(good)right++;
    mat.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(Q.opts[+x.dataset.k].ok)x.classList.add("ok")});
    if(!good)btn.classList.add("no");
    const best=Q.opts.find(x=>x.ok),last=q===QS.length-1;
    say(good?U.right:U.wrong);
    $("#why").innerHTML=`<div class="why"><strong>${good?U.gotIt:U.catch}</strong> ${esc(o.why)}${good?"":`<br><br><strong>${U.better}:</strong> ${esc(best.why)}`}</div>
     <div class="row"><button class="btn" id="nx">${last?U.finish:U.next}</button></div>`;
    $("#nx").focus();
    st.pos[st.theme]=last?null:{i,q:q+1,right};save();
    $("#nx").onclick=()=>last?finish(i,right,QS.length):pick(i,q+1,right);
  });
}

function build(i){
  const b=BELTS[i],B=buildOf(),on=new Set();
  mat.innerHTML=head(b)+`<h2>${U.buildQ}</h2>
   <div class="task"><strong>${U.task}:</strong> ${esc(B.task)}</div><p class="small">${U.buildHint}</p>
   <div class="chips">${B.chips.map(c=>`<button class="chip" aria-pressed="false" data-id="${c.id}">${esc(c.t)}</button>`).join("")}</div>
   <div class="small">${U.quality}</div><div class="meter"><i id="mt"></i></div>
   <div class="two"><div class="pane"><h3>${U.yourMsg}</h3><div id="pp"></div></div><div class="pane"><h3>${U.likely}</h3><div id="rp"></div></div></div>
   <div class="row"><button class="btn" id="chk">${U.check}</button></div><div id="why"></div>`;
  const count=()=>{const sel=B.chips.filter(c=>on.has(c.id)),g=sel.filter(c=>c.good).length;return{sel,g,f:sel.length-g}};
  const draw=()=>{const{sel,g,f}=count();
    $("#pp").textContent=B.base+(sel.length?"\n"+sel.map(c=>"• "+c.t).join("\n"):"");
    const lvl=f>=2?0:g<=1?(f?0:1):g<=3?2:3;
    $("#rp").textContent=B.replies[f&&lvl>1?lvl-1:lvl];
    $("#mt").style.width=Math.max(5,Math.min(100,g*20-f*15))+"%";};
  mat.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const id=c.dataset.id;on.has(id)?on.delete(id):on.add(id);c.setAttribute("aria-pressed",on.has(id));draw();$("#why").innerHTML=""});
  draw();
  $("#chk").onclick=()=>{const{g,f}=count(),pass=g>=4&&f===0;
    const miss=B.chips.filter(c=>c.good&&!on.has(c.id)).map(c=>c.t);
    $("#why").innerHTML=`<div class="why"><strong>${pass?U.clean:U.almost}</strong> ${pass?esc(U.cleanWhy):""}${f?" "+esc(U.fluff):""}${g<4?` ${U.missing} ${esc(miss.join("; "))}.`:""}</div>${pass?`<div class="row"><button class="btn" id="nx">${U.finish}</button></div>`:""}`;
    say(pass?U.buildOk:U.buildNo);
    if(pass)$("#nx").onclick=()=>finish(i,1,1);};
}

function finish(i,right,total){
  delete st.pos[st.theme];
  const need=Math.ceil(total*0.66),pass=right>=need,b=BELTS[i];
  if(pass&&!W().includes(i))W().push(i);
  save();rack(pass?i:undefined);
  const nxt=i+1<BELTS.length?i+1:null;
  mat.innerHTML=head(b)+`<div class="score">${right}/${total}</div>
   <h2 style="margin-top:8px">${pass?esc(U.won(b.name)):U.notYet}</h2>
   <p class="lede">${esc(pass?U.unlocked(b.skill.toLowerCase()):U.need(need,total))}</p>
   <div class="row">${pass&&nxt!==null?`<button class="btn red" id="go">${esc(U.goNext(BELTS[nxt].name))}</button>`:""}<button class="btn ghost" id="re">${U.retry}</button></div>`;
  say(pass?U.bow:U.fail);
  $("#re").onclick=()=>start(i);
  if($("#go"))$("#go").onclick=()=>start(nxt);
}

let samplerP=null;const getSampler=()=>samplerP||(samplerP=(window.claude&&window.claude.use?window.claude.use("sample"):Promise.resolve(null)).catch(()=>null));
function heuristic(p){
  const H=U.h,R=U.rx,fix=[],good=[];let s=25;
  if(p.length>120){s+=20;good.push(H.long)}else fix.push(H.short);
  if(/\d/.test(p)){s+=15;good.push(H.num)}else fix.push(H.noNum);
  if(R.me.test(p)){s+=20;good.push(H.me)}else fix.push(H.noMe);
  if(R.fmt.test(p)){s+=15;good.push(H.fmt)}else fix.push(H.noFmt);
  if(R.hype.test(p)){s-=10;fix.push(H.hype)}
  return {score:Math.max(0,Math.min(100,s)),strengths:good,fixes:fix,rewrite:""};
}
const claudeUrl=t=>"https://claude.ai/new?q="+encodeURIComponent(t.slice(0,6000));
function copyText(t){const done=()=>{$("#cp").textContent=U.copied};const fail=()=>{$("#cp").innerHTML=`${esc(U.copyFail)}<div class="pane" style="margin-top:6px;user-select:all">${esc(t)}</div>`};
  try{navigator.clipboard.writeText(t).then(done,fail)}catch(e){fail()}}
function free(i){
  const b=BELTS[i],FR=freeOf(),sc=FR[Math.floor(Math.random()*FR.length)];
  mat.innerHTML=head(b)+`<h2>${U.freeQ}</h2>
   <div class="task"><strong>${U.situation}:</strong> ${esc(sc)}</div>
   <label for="ta" class="small">${U.freeLabel}</label>
   <textarea id="ta" placeholder="${esc(U.freePh)}"></textarea>
   <div class="row"><button class="btn red" id="grade">${U.grade}</button><button class="btn ghost" id="new">${U.other}</button></div>
   <div id="out" aria-live="polite"></div>`;
  $("#new").onclick=()=>free(i);
  const DK="pdojo-draft-"+st.theme;try{$("#ta").value=localStorage.getItem(DK)||""}catch(e){}
  $("#ta").oninput=()=>{try{localStorage.setItem(DK,$("#ta").value)}catch(e){}};
  $("#grade").onclick=async()=>{
    const p=$("#ta").value.trim();if(p.length<10){say(U.empty);return}
    const btn=$("#grade");btn.disabled=true;btn.textContent=U.grading;say(U.study);
    let r=null,real=false;const s=await getSampler();
    if(s){try{r=await s.json(`You are scoring a message written by an everyday person who is new to AI assistants and tends to type into them like a Google search. They are learning to talk to the assistant instead: describing their real situation, giving useful details, saying what they want back.
Situation they were given: "${sc}"
Their message:
"""${p}"""
Score how likely this message is to get a genuinely useful, personal answer (0-100). Reward: real context, specifics, constraints, saying what they want back. Penalise: search-style keywords, vagueness, empty hype. Invented details are fine. Be warm, plain-spoken and encouraging; no jargon (never say "prompt").
Write strengths, fixes and rewrite in ${L.aiLang||L.langName}.
Return ONLY JSON: {"score": integer 0-100, "strengths": [up to 3 short strings], "fixes": [up to 3 short, concrete strings], "rewrite": "an improved version of their message, under 100 words, keeping their details"}`,{modelTier:"quick"});real=r&&typeof r.score==="number"}catch(e){r=null}}
    if(!real)r=heuristic(p);
    btn.disabled=false;btn.textContent=U.again;
    const pass=r.score>=75;
    if(pass&&!W().includes(i)){W().push(i);save();rack(i)}
    say(pass?U.blackOk:U.blackNo);
    $("#out").innerHTML=`<div class="why"><div class="score">${r.score}</div><p class="small">${real?U.byClaude:U.offline} · ${U.pass}</p>
     ${(r.strengths||[]).length?`<strong>${U.works}</strong><ul class="fb">${r.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
     ${(r.fixes||[]).length?`<strong>${U.improve}</strong><ul class="fb">${r.fixes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
     ${r.rewrite?`<strong>${U.stronger}</strong><div class="pane" style="margin-top:6px">${esc(r.rewrite)}</div>`:""}</div>
     <p class="small" style="margin:16px 0 0">${U.takeIt}</p><div class="row" style="margin-top:8px"><a class="btn red" id="ask" target="_blank" rel="noopener" href="${claudeUrl(U.coachMsg(sc,p))}">${U.askClaude}</a><a class="btn ghost" id="try" target="_blank" rel="noopener" href="${claudeUrl(p)}">${U.tryClaude}</a></div><div id="cp" class="small" aria-live="polite"></div>
     ${s?`<div class="row"><button class="btn" id="run">${U.run}</button></div><div id="ans"></div>`:""}`;
    const hook=(id,text)=>{$(id).onclick=()=>{copyText(text)};};hook("#ask",U.coachMsg(sc,p));hook("#try",p);
    if($("#run"))$("#run").onclick=async()=>{
      const rb=$("#run");rb.disabled=true;$("#ans").innerHTML=`<div class="pane" id="live" style="margin-top:12px">${U.thinking}</div>`;
      try{await s(p,{modelTier:"quick",cache:false,onText:({text})=>{$("#live").textContent=text}})}
      catch(e){$("#live").textContent=e&&e.code==="rate_limited"?U.limited:U.noReach}
      rb.disabled=false;};
  };
}

setLang(st.lang);say(U.hello);
resume();
}
</script>
</body>
</html>
